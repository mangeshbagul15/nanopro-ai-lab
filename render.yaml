# Render Infrastructure-as-Code Blueprint
# NanoPro Production Global AI Lab (Zero-Bloat, Egress-Safe, Sub-Second Latency)
services:
  - type: web
    name: nanopro-ai-lab
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CLOUDFLARE_EDGE_URL
        value: https://mangesh-nanopro.mangeshbagul15.workers.dev
      - key: GROQ_API_KEY
        sync: false
      - key: DEFAPI_API_KEY
        sync: false
      - key: JEV_API_KEY
        sync: false
